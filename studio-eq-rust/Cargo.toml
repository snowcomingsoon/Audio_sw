[package]
name = "studio_eq_master_pro"
version = "3.0.0"
edition = "2021"
description = "Studio Parametric EQ, AI Stem Mixer & Sala Prove Mastering Suite"

[[bin]]
name = "StudioEQ_Master_Pro"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = true }
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rustfft = "6.2"
hound = "3.5"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = false
