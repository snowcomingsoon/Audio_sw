name: Build macOS Apple Silicon M1 DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-m1-dmg:
    name: macOS Apple Silicon M1 (arm64) App & DMG v3.1.0
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (Apple Silicon arm64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio-eq-rust

      - name: Build StudioEQ Master Pro.app & Native M1 DMG (with Unit Tests)
        run: bash macos/build_macos_m1_dmg.sh

      - name: Verify Native M1 AI Setup Script & Metal MPS Environment
        run: |
          bash macos/setup_ai_macos_m1.sh
          "$HOME/Library/Application Support/StudioEQ_Master_Pro/.venv/bin/python3" -c "import sys; sys.path.insert(0, 'dist/StudioEQ Master Pro.app/Contents/Resources'); import demucs_pedalboard_master as dpm; from audio_modules import drumsep_v3, apollo_restorer, bass_enhancer, vocal_autotune, time_stretch_bpm; print('GPU M1:', dpm.detect_gpu_label()); print('FFmpeg:', dpm._resolve_ffmpeg_bin())"

      - name: Upload macOS M1 DMG Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudioEQ_Master_Pro_v3.1.0_macOS_M1_arm64
          path: StudioEQ_Master_Pro_v3.1.0_macOS_M1_arm64.dmg
          if-no-files-found: error
          retention-days: 90

      - name: Publish macOS M1 DMG to GitHub Release v3.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0
          target_commitish: ${{ github.sha }}
          name: "StudioEQ Master Pro v3.1.0 — Windows x64 & macOS Apple Silicon (M1/M2/M3/M4)"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            StudioEQ_Master_Pro_v3.1.0_macOS_M1_arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
