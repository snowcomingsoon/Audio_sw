name: Build macOS Apple Silicon M1 DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-m1-dmg:
    name: macOS Apple Silicon M1 Full Offline Setup DMG v3.1.0
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (Apple Silicon arm64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio-eq-rust

      - name: Build Full Offline Setup DMG (Rust + Python 3.12 + PyTorch MPS + FFmpeg + All AI Models)
        run: bash macos/build_macos_m1_dmg.sh

      - name: Test Full Offline Installation & End-to-End AI Separation on Clean Mac M1
        run: |
          MOUNT_OUT="$(hdiutil attach StudioEQ_Master_Pro_v3.1.0_Setup_Completo_macOS_M1_arm64.dmg -nobrowse)"
          echo "${MOUNT_OUT}"
          sudo installer -pkg "/Volumes/StudioEQ Master Pro Setup/Installa StudioEQ Master Pro.pkg" -target /
          hdiutil detach "/Volumes/StudioEQ Master Pro Setup" || true

          # Verifica firma .app installata in /Applications
          codesign --verify --deep --strict --verbose=2 "/Applications/StudioEQ Master Pro.app"

          # Genera un brano stereo sintetico di 3.5s e lancia l'intera pipeline Studio v3 100% OFFLINE!
          TEST_DIR="$(mktemp -d)"
          HF_HUB_OFFLINE=1 \
          HF_HOME="/Library/Application Support/StudioEQ_Master_Pro/models" \
          PYTHONDONTWRITEBYTECODE=1 \
          PYTHONNOUSERSITE=1 \
          "/Library/Application Support/StudioEQ_Master_Pro/python/bin/python3" - "${TEST_DIR}" <<'PYEOF'
          import math
          import os
          import struct
          import sys
          import wave

          test_dir = sys.argv[1]
          in_wav = os.path.join(test_dir, "test_input.wav")
          out_dir = os.path.join(test_dir, "out_offline")
          sr = 44100
          n = int(sr * 3.5)
          with wave.open(in_wav, "wb") as wf:
              wf.setnchannels(2)
              wf.setsampwidth(2)
              wf.setframerate(sr)
              frames = bytearray()
              for i in range(n):
                  t = i / sr
                  kick = 0.55 * math.sin(2 * math.pi * 62 * t) * math.exp(-((t % 0.5) * 14.0))
                  gtr = 0.22 * math.sin(2 * math.pi * 220 * t)
                  v = max(-0.95, min(0.95, kick + gtr))
                  s = int(v * 32767)
                  frames += struct.pack("<hh", s, s)
              wf.writeframes(bytes(frames))

          sys.path.insert(0, "/Library/Application Support/StudioEQ_Master_Pro")
          import demucs_pedalboard_master as dpm

          print("GPU rilevata:", dpm.detect_gpu_label())
          print("FFmpeg standalone:", dpm._resolve_ffmpeg_bin())
          rep = dpm.run_full_pipeline(
              in_wav,
              out_dir,
              autotune_mode="natural",
              drum_mode="studio_v3",
              bass_mode="natural",
          )
          assert os.path.isfile(os.path.join(out_dir, "Master_AI_Demucs_Pedalboard.wav"))
          assert os.path.isfile(os.path.join(out_dir, "Master_AI_Demucs_Pedalboard.mp3"))
          assert os.path.isfile(os.path.join(out_dir, "stems_studio", "02_Batteria_StudioEQ.wav"))
          print("VERIFICA OFFLINE END-TO-END SUPERATA AL 100%!", rep["master_ai"])
          PYEOF
          rm -rf "${TEST_DIR}"

      - name: Upload Full Offline macOS M1 Setup DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudioEQ_Master_Pro_v3.1.0_Setup_Completo_macOS_M1_arm64
          path: StudioEQ_Master_Pro_v3.1.0_Setup_Completo_macOS_M1_arm64.dmg
          if-no-files-found: error
          retention-days: 90

      - name: Publish Full Offline macOS M1 Setup DMG to GitHub Release v3.1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0
          name: "StudioEQ Master Pro v3.1.0 — Setup Completo Offline (Windows x64 & macOS Apple Silicon M1)"
          draft: false
          prerelease: false
          make_latest: true
          files: |
            StudioEQ_Master_Pro_v3.1.0_Setup_Completo_macOS_M1_arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
